<!DOCTYPE html>
<html lang='en'>
<head>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>

<title>TOBI</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#F5ECD3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }

  .phone {
    width:320px;
    background:#191553;
    border-radius:36px;
    border:6px solid #1E2719;
    padding:18px 16px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }

  .topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }

  .logo {
    background:#F5ECD3;
    color:#191553;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    padding:6px 14px;
    border-radius:6px;
  }

  .topbar-right {
    display:flex;
    align-items:center;
    gap:8px;
  }

  .time {
    font-size:11px;
    color:#F5ECD3;
    letter-spacing:0.5px;
    font-variant-numeric: tabular-nums;
  }

  .status-light {
    width:14px;
    height:14px;
    border-radius:50%;
    flex-shrink:0;
  }

  .light-off  { background:#C83408; }
  .light-on   { background:#7FCB8F; }
  .light-busy { background:#FB961B; }

  .card {
    background:rgba(245,236,211,0.08);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }

  .card-label {
    font-size:11px;
    color:#FB961B;
    letter-spacing:0.5px;
    margin-bottom:8px;
    text-transform:uppercase;
  }
  

  .banner {
    background:#F5ECD3;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .banner-text {
    color:#191553;
    font-size:14px;
    font-weight:600;
    line-height:1.3;
  }

  .toggle-btn {
    width:48px;
    height:48px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    color:#F5ECD3;
    cursor:pointer;
    flex-shrink:0;
  }

  .toggle-off { background:#C83408; }
  .toggle-on  { background:#7FCB8F; color:#191553; }

  .sensor-value {
    font-size:26px;
    font-weight:700;
    color:#F5ECD3;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  
  .sensor-value2 {
    font-size:26px;
    font-weight:700;
    color:#F5ECD3;
    text-align:center;
    font-variant-numeric: tabular-nums;
    background: #5C6168;
  }

  .triple-row {
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:8px;
  }

  .triple-item {
    background:rgba(245,236,211,0.08);
    border-radius:10px;
    padding:10px 6px;
    text-align:center;
  }

  .triple-axis {
    font-size:10px;
    color:#FB961B;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .triple-val {
    font-size:15px;
    font-weight:700;
    color:#F5ECD3;
  }

  .triple-unit {
    font-size:9px;
    color:#F5ECD3;
    opacity:0.5;
    margin-top:2px;
  }

  .dl-row {
    display:flex;
    align-items:center;
    gap:10px;
  }

  .dl-btn {
    flex:1;
    background:#F5ECD3;
    color:#191553;
    border:none;
    border-radius:10px;
    padding:12px 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .dl-status {
    width:48px;
    height:48px;
    border-radius:50%;
    background:#FB961B;
    color:#191553;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:700;
    line-height:1.1;
    text-align:center;
    flex-shrink:0;
  }

  .summary-row {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid rgba(245,236,211,0.1);
    font-size:12px;
  }

  .summary-row:last-child { border-bottom:none; }

  .summary-key { color:#F5ECD3; opacity:0.65; }
  .summary-val { color:#F5ECD3; font-weight:600; }

  .chart-wrap {
    height:90px;
    margin-bottom:4px;
  }

  .pulse-dot {
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }

  .state-switch {
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:20px;
  }

  .state-btn {
    background:#191553;
    color:#F5ECD3;
    border:1px solid #191553;
    border-radius:8px;
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }

  .state-btn.active {
    background:#FB961B;
    color:#191553;
    border-color:#FB961B;
  }

  .caption {
    text-align:center;
    font-size:11px;
    color:#191553;
    opacity:0.5;
    margin-top:10px;
    letter-spacing:0.5px;
  }

  .phone-scroll {
    max-height:520px;
    overflow-y:auto;
    scrollbar-width:none;
  }

  .phone-scroll::-webkit-scrollbar { display:none; }

  .scroll-hint {
    display:flex;
    justify-content:center;
    margin-top:4px;
    margin-bottom:6px;
    color:#F5ECD3;
    opacity:0.4;
    font-size:14px;
    animation: bob 1.6s ease-in-out infinite;
  }

  @keyframes bob {
    0%,100% { transform:translateY(0); opacity:0.4; }
    50% { transform:translateY(4px); opacity:0.8; }
  }

<body>

<div>
  <div class='phone'>
    <div id='topbar-fixed'><div class='topbar'><div class='logo'>LOGO</div><div class='topbar-right'><div class='time'>10:26</div><div class='status-light status-light light-busy pulse-dot'></div></div></div></div>
    <div class='phone-scroll' id='phone'><div style='height:6px;'></div><div class='banner'><div class='banner-text'>Connected.<br>Device online.</div><div class='status-light light-on'></div></div><div class='banner'><div class='banner-text'>Device connected.<br>Starting…</div><div class='status-light light-busy pulse-dot'></div></div><div class='card'><div class='card-label'>Active systems</div> <div class='card-label' style='margin-bottom:4px;'>Battery</div><div class='sensor-value' style='margin-bottom:14px;'>6.6V</div>
      <div class='card-label' style='margin-bottom:4px;'>Barometer</div><div class='sensor-value' style='margin-bottom:14px;'>40°</div><div class='card-label'>Accelerometer</div><div class='triple-row'><div class='triple-item'><div class='triple-axis'>x</div><div class='triple-val'>0.2</div><div class='triple-unit'>m/s</div></div><div class='triple-item'><div class='triple-axis'>y</div><div class='triple-val'>0.2</div><div class='triple-unit'>m/s</div></div><div class='triple-item'><div class='triple-axis'>z</div><div class='triple-val'>0.2</div><div class='triple-unit'>m/s</div></div></div></div></div>
    <div class='scroll-hint' id='scroll-hint' style='display: none;'>▼</div>
  </div>
  <div class='state-switch'>
    <button class='state-btn active' data-state='startup' onclick='setState('startup')'>Startup</button>
    <button class='state-btn' data-state='ready' onclick='setState('ready')'>Ready</button>
    <button class='state-btn' data-state='landed' onclick='setState('landed')'>Landed</button>
  </div>
  <div class='caption'>Drive this externally by setting deviceState below</div>
</div>

<script>
  // ── External state input ──────────────────────────────────────────────
  // Set this to one of: 'startup', 'ready', 'landed'
  // 'ready' renders the toggle in OFF position; tapping it flips to ARMED
  // visuals without changing the external state string itself.
  
  let deviceState = 'startup';
  let armed = false;

  function setState(s){
    deviceState = s;
    if(s !== 'ready') armed = false;
    document.querySelectorAll('.state-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.state===s);
    });
    render();
  }

  function toggleArmed(){
    armed = !armed;
    render();
  }

  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function topbar(lightClass){
    return '<div class='topbar'>'
      + '<div class='logo'>LOGO</div>'
      + '<div class='topbar-right'>'
      + '<div class='time'>'+nowTime()+'</div>'
      + '<div class='status-light '+lightClass+''></div>'
      + '</div></div>';
  }

  function mockSensor(base, amp){
    const t = Date.now()/1000;
    return (base + Math.sin(t*0.6)*amp).toFixed(1);
  }

  function tripleRow(){
    return '<div class='triple-row'>'
      + ['x','y','z'].map(ax=>(
        '<div class='triple-item'>'
        + '<div class='triple-axis'>'+ax+'</div>'
        + '<div class='triple-val'>0.2</div>'
        + '<div class='triple-unit'>m/s</div>'
        + '</div>'
      )).join('')
      + '</div>';
  }

  //Startup
  function renderStartup(){
    return {
      top: topbar('status-light light-busy pulse-dot'),
      body:
        '<div style='height:6px;'></div>'
        + '<div class='banner'>'
          + '<div class='banner-text'>Connected.<br>Device online.</div>'
          + '<div class='status-light light-on'></div>'
        + '</div>'
        + '<div class='banner'>'
          + '<div class='banner-text'>Device connected.<br>Starting&hellip;</div>'
          + '<div class='status-light light-busy pulse-dot'></div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Active systems</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Battery</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>6.6 V</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Barometer</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>40&deg;</div>'
          + '<div class='card-label'>Accelerometer</div>'
          + tripleRow()
        + '</div>'
        + '<div class='card' style='margin-top:4px;'>'
          + '<div class='card-label'>System Settings</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Accelerometer Range</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>+-32G</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Accelerometer Data Rate</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>6.66 KHz</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Barometer Range</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>2,000 degrees/s</div>'
          + '<div class='card-label' style='margin-bottom:4px;'>Barometer Data Rate</div>'
          + '<div class='sensor-value' style='margin-bottom:14px;'>6.66 KHz</div>'

      // + '<div class='card-label' style='margin-bottom:4px;'>Barometer Range</div>'
      //     + '<div class='sensor-value' style='margin-bottom:14px;'>2,000 degrees/s</div>'
      //     + '<div class='card-label' style='margin-bottom:4px;'>Barometer Data Rate</div>'
      //     + '<div class='sensor-value' style='margin-bottom:14px;'6.66 KHz</div>'
        + '</div>'
    };
  }

  //Ready/Armed
  function renderReady(){
    const isArmed = armed;
    return {
      top: topbar(isArmed ? 'status-light light-on' : 'status-light light-busy'),
      body:
        '<div style='height:6px;'></div>'
        + '<div class='banner'>'
          + '<div class='banner-text'>Device ready<br>for flight</div>'
          + '<button class='toggle-btn '+(isArmed?'toggle-on':'toggle-off')+'' onclick='toggleArmed()'>'+(isArmed?'ON':'OFF')+'</button>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label' style='color:'+(isArmed?'#7FCB8F':'#C83408')+';'>Barometric pressure</div>'
          + '<div class='sensor-value'>'+mockSensor(65.4,0.3)+'&deg;</div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label' style='color:'+(isArmed?'#7FCB8F':'#C83408')+';'>Acceleration</div>'
          + tripleRow()
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label' style='color:'+(isArmed?'#7FCB8F':'#C83408')+';'>Barometric pressure</div>'
          + '<div class='sensor-value'>'+mockSensor(65.4,0.3)+'&deg;</div>'
        + '</div>'
    };
  }

  function renderLanded(){
    const W=270,H=90;
    const pts=[];
    const N=24;
    for(let i=0;i<N;i++){
      const x=(i/(N-1))*W;
      let frac=i/(N-1);
      let y;
      if(frac<0.15) y=H-(frac/0.15)*H*0.95;
      else if(frac<0.3) y=H*0.05+Math.sin(frac*40)*3;
      else y=H*0.05+(frac-0.3)/0.7*H*0.8;
      pts.push(x.toFixed(1)+','+y.toFixed(1));
    }
    const chart = '<svg viewBox='0 0 '+W+' '+H+'' width='100%' height='90' preserveAspectRatio='none'>'
      + '<polyline points=''+pts.join(' ')+'' fill='none' stroke='#7FCB8F' stroke-width='2' stroke-linejoin='round'/>'
      + '</svg>';

    //Landed
    return {
      top: topbar('status-light light-on'),
      body:
        '<div style='height:6px;'></div>'
        + '<div class='card'>'
          + '<div class='chart-wrap'>'+chart+'</div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Download CSV</div>'
          + '<div class='dl-row'>'
            + '<button class='dl-btn'>Download</button>'
            + '<div class='dl-status'>In<br>progress</div>'
          + '</div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Flight summary</div>'
          + '<div class='summary-row'><div class='summary-key'>Apogee</div><div class='summary-val'>4324 ft</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Drogue deployment</div><div class='summary-val'>2345 ft</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Main deployment</div><div class='summary-val'>1234 ft</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Max velocity</div><div class='summary-val'>213 ft/s</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Average velocity</div><div class='summary-val'>233 ft/s</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Time to apogee</div><div class='summary-val'>8.0 s</div></div>'
          + '<div class='summary-row'><div class='summary-key'>Time to main</div><div class='summary-val'>11.5 s</div></div>'
        + '</div>'

        + '<div class='card' style='margin-top:4px;'>'
          + '<div class='card-label' style='color:#FB961B;'>Download CSV</div>'
          + '<div class='dl-row'>'
            + '<button class='dl-btn'>Download</button>'
            + '<div class='dl-status'>In<br>progress</div>'
          + '</div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Barometric pressure</div>'
          + '<div class='sensor-value'>65.4&deg;</div>'
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Acceleration</div>'
          + tripleRow()
        + '</div>'
        + '<div class='card'>'
          + '<div class='card-label'>Barometric pressure</div>'
          + '<div class='sensor-value'>65.4&deg;</div>'
        + '</div>'
    };
  }

  function render(){
    const top = document.getElementById('topbar-fixed');
    const phone = document.getElementById('phone');
    const hint = document.getElementById('scroll-hint');
    let out;
    if(deviceState==='startup') out = renderStartup();
    else if(deviceState==='ready') out = renderReady();
    else out = renderLanded();

    top.innerHTML = out.top;
    phone.innerHTML = out.body;
    hint.style.display = (deviceState==='landed') ? 'flex' : 'none';
  }

  setState('startup');
  setInterval(()=>{ if(deviceState==='startup' || deviceState==='ready') render(); }, 1000);
</script>


</body>
</html>
